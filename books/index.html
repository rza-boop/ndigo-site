<style>
/* Layout: top bar; the display case (Blender renders: empty lit case + one sprite sequence per book) behind CSS glass; a slim strip under the glass (arrows + slot readout); the record typed out on the page itself; two plain buttons. Website combo, VT323. */
:root{
  --P:#E100FF; --G:#7CFF4F; --B:#16141A; --ink:#E9E4EE; --dim:#9C95A6; --rule:#2C2833;
  --chrome:#141414; --line:#2E2E2E; --cink:#EDEDED; --cdim:#A3A3A3; --cfaint:#6B6B6B; --cpanel:#1C1C1C;
  --vt:"VT323",ui-monospace,Menlo,monospace; --mono:"Martian Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--B);color:var(--ink);font:400 22px/1.35 var(--vt);overflow-x:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1180px;margin:0 auto}

.review{background:var(--chrome);color:var(--cink);font:400 12px/1.45 var(--mono);border-bottom:1px solid var(--line)}
.review .in{max-width:1240px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px}
.review .what{flex:1 1 420px;color:var(--cdim)} .review .what b{color:var(--cink)}
.seg{display:flex}
.seg button{font:400 11px/1 var(--mono);color:var(--cdim);background:none;border:1px solid var(--line);padding:8px 10px;cursor:pointer;margin-left:-1px}
.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button[aria-pressed="true"][data-v="Pick"]{background:var(--P);color:#1a0020;border-color:var(--P)}
.seg button[aria-pressed="true"][data-v="Revise"]{background:var(--G);color:#0c2000;border-color:var(--G)}
.seg button[aria-pressed="true"][data-v="Drop"]{background:#5a5a5a;color:#fff}
.review textarea{flex:1 1 260px;font:400 13px/1.4 var(--mono);color:var(--cink);background:var(--cpanel);border:1px solid var(--line);border-radius:4px;padding:8px;min-height:36px;resize:vertical}
.review .status{color:var(--cfaint)}

header.top{border-bottom:1px solid var(--rule)}
header.top .in{max-width:1240px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px}
header.top .brand{display:flex;align-items:center;gap:16px}
header.top svg{height:46px;width:auto;display:block}
.crumb{color:var(--dim);font-size:24px}
.crumb a{color:var(--dim);text-decoration:none}.crumb a:hover{color:var(--G)}
.crumb b{color:var(--ink);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:400 22px/1 var(--vt);color:var(--dim);background:none;border:1px solid var(--rule);padding:7px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--B);background:var(--G);border-color:var(--G)}
.tabs button .n{opacity:.7;margin-left:6px}

main{padding-block:clamp(22px,4vw,40px) 60px}
/* the case: empty plate from the picked reference, a row of real spine cut-outs, covers cut from the pulled stills.
   Geometry is in the source image's pixels (1536×1024); the plate scales to fit. */
.shot{position:relative;aspect-ratio:3/2;border-radius:6px;overflow:hidden;background:#0b0a0c;box-shadow:0 30px 60px -30px #000}
.plate{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0}
.plate .empty{position:absolute;inset:0;width:1536px;height:1024px}
.band{position:absolute;left:30px;width:1478px;top:120px;height:720px;overflow:hidden;perspective:1700px;perspective-origin:50% 45%}
.row{position:absolute;left:0;bottom:85px;display:flex;align-items:flex-end;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.34,1.36,.5,1)}
.bk{position:relative;flex:0 0 var(--sw);height:525px;transition:flex-basis .6s cubic-bezier(.2,.8,.2,1);cursor:pointer;background:none;border:0;padding:0;transform-style:preserve-3d}
.bk.sel{flex-basis:calc(var(--cw) + 34px)}
.bob{position:absolute;inset:0;transform-style:preserve-3d}
.row.moving .bob{animation:bob .95s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--k) * 15ms)}
@keyframes bob{0%,100%{transform:translateY(0)}28%{transform:translateY(-12px)}58%{transform:translateY(3px)}}
.box{position:absolute;bottom:0;left:50%;width:var(--cw);height:var(--ch);margin-left:calc(var(--cw) / -2);transform-style:preserve-3d;transform:rotateY(90deg);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.bk.sel .box{transform:translateZ(70px) translateY(4px) rotateY(-8deg)}
.face{position:absolute;bottom:0;backface-visibility:hidden}
.face.front{left:0;width:var(--cw);height:var(--ch);transform:translateZ(calc(var(--sw) / 2))}
.face.front img{width:100%;height:100%;display:block}
.bk .face.front{opacity:0;transition:opacity .25s .35s}
.bk.sel .face.front{opacity:1;transition-delay:0s}
.face.spine{left:calc((var(--cw) - var(--sw)) / 2);width:var(--sw);height:525px;transform:rotateY(-90deg) translateZ(calc(var(--cw) / 2))}
.face.spine img{width:100%;height:100%;display:block}
.face.pages{left:calc((var(--cw) - var(--sw)) / 2 + 4px);width:calc(var(--sw) - 8px);height:calc(var(--ch) - 10px);bottom:5px;transform:rotateY(90deg) translateZ(calc(var(--cw) / 2 - 3px));background:repeating-linear-gradient(90deg,#cfc3a8 0 1px,#a99d84 1px 2px)}
.shade{position:absolute;left:-12%;right:-12%;bottom:-6px;height:16px;border-radius:50%;background:#000;filter:blur(7px);opacity:0;transition:opacity .6s}
.bk.sel .shade{opacity:.6}
.bk:focus-visible{outline:4px solid var(--G);outline-offset:-4px}
/* the case (old) */
.frame{padding:10px;border-radius:6px;background:linear-gradient(160deg,#2f2b33,#141216 40%,#211e25);box-shadow:0 30px 60px -30px #000,inset 0 1px 0 #ffffff1f}
.case{position:relative;overflow:hidden;border-radius:3px;background:#0d0b0c}
.stage{position:absolute;left:0;top:0;width:2000px;height:900px;transform-origin:0 0}
.stage .bg{position:absolute;inset:0;width:2000px;height:900px}
.track{position:absolute;left:0;top:0;height:900px;display:flex;transition:transform .95s cubic-bezier(.34,1.38,.5,1)}
.slot{position:relative;flex:0 0 69px;height:900px;margin-right:5px;cursor:pointer;background:none;border:0;padding:0;transition:flex-basis .55s cubic-bezier(.2,.8,.2,1)}
.slot.sel{flex-basis:330px;z-index:5}
.slot img{position:absolute;left:50%;top:130px;width:640px;height:640px;margin-left:-320px;pointer-events:none;filter:brightness(.8) contrast(1.15) saturate(.92)}
.slot.sel img{filter:brightness(.95) contrast(1.08)}
.track.moving .slot img{animation:bob .9s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--k) * 16ms)}
@keyframes bob{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}60%{transform:translateY(2px)}}
.slot:focus-visible{outline:4px solid var(--G);outline-offset:-4px}
.glass{position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(112deg,#ffffff00 0 16%,#ffffff12 21%,#ffffff04 26%,#ffffff00 31% 66%,#ffffff0b 70%,#ffffff00 75%),linear-gradient(#ffffff05,#ffffff00 40%);
  box-shadow:inset 0 0 0 1px #ffffff22,inset 0 0 60px #00000055}
.plaque{display:flex;justify-content:center;margin-top:-1px}
.plaque span{font:500 13px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#d8c592;background:linear-gradient(#5a4628,#3a2c18);border:1px solid #806640;padding:7px 14px;border-radius:0 0 3px 3px;box-shadow:0 6px 12px #0008}

/* strip under the glass */
.strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:16px}
.key{font:400 30px/1 var(--vt);width:54px;height:48px;border-radius:5px;border:1px solid #403b47;background:linear-gradient(#34303a,#1d1a21);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #0b0a0d,inset 0 1px 0 #ffffff1c}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0a0d}
.key:hover{color:var(--G)}
.lcd{background:#0b0f0a;border:1px solid #27321f;border-radius:4px;padding:9px 14px;color:var(--G);font-size:26px;display:flex;justify-content:space-between;gap:12px;box-shadow:inset 0 0 16px #000;text-shadow:0 0 6px #7CFF4F55;min-width:0}
.lcd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd .r{color:var(--dim);text-shadow:none}

/* the record, typed on the page */
.record{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px 48px;margin-top:38px}
.kick{color:var(--P);font-size:22px}
.title{font-size:clamp(42px,6vw,76px);line-height:.95;margin:6px 0 18px;text-wrap:balance;min-height:1em}
.cur{display:inline-block;width:.45em;height:.8em;background:var(--G);margin-left:.08em;vertical-align:-.04em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;font-size:21px}
dl.kv dt{color:var(--dim)} dl.kv dt::after{content:":"}
dl.kv dd{margin:0}
dl.kv dd.sum{color:#d9d3e0;max-width:58ch}
.line{opacity:0;transition:opacity .15s}.line.on{opacity:1}
.side h3{font:400 22px/1 var(--vt);color:var(--P);margin:0 0 8px;display:flex;justify-content:space-between}
.side h3 small{color:var(--dim);font-size:18px}
.side ul{list-style:none;margin:0 0 22px;padding:0}
.inc li{padding:5px 0 5px 20px;position:relative;border-bottom:1px dashed var(--rule);font-size:20px;color:#d9d3e0}
.inc li::before{content:"+";position:absolute;left:4px;color:var(--G)}
.ess li{border-bottom:1px dashed var(--rule)}
.ess button{all:unset;cursor:pointer;display:flex;gap:10px;justify-content:space-between;width:100%;padding:7px 0;font-size:21px;color:var(--ink)}
.ess button:hover,.ess button:focus-visible{color:var(--G)}
.ess button span:last-child{color:var(--dim)}
.ess .pv{display:none;padding:0 0 10px 16px;color:var(--dim);font-size:19px;border-left:2px solid var(--P)}
.ess li.open .pv{display:block}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{font:400 26px/1 var(--vt);padding:13px 22px;text-decoration:none;border:2px solid var(--G);color:var(--B);background:var(--G);border-radius:3px}
.btn:hover{background:#9dff7a}
.btn.ghost{background:none;color:var(--ink);border-color:#4a4552}
.btn.ghost:hover{border-color:var(--P);color:var(--P)}
.tag{font:400 11px/1.4 var(--mono);color:var(--cfaint);text-align:center;padding:10px 16px 30px;background:var(--chrome)}
:focus-visible{outline:2px solid var(--G);outline-offset:3px}
@media (max-width:820px){.record{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.track,.slot{transition:none}.track.moving .slot img{animation:none}.cur{animation:none}}
</style>

<script>
const BOOKS=[{"id": "ot1", "line": "overtime", "no": 1, "img": "o1", "ndigo": "i01", "title": "Siddhartha", "spine": "SIDDHARTHA", "author": "Hermann Hesse", "original": "1922 · German", "work": "Siddhartha: An Indian Poem", "edition": "New annotated translation from the 1922 German", "editor": "Translated & annotated by Ryan Collison", "summary": "A young Brahmin leaves his father's house and joins the wandering ascetics. He meets the Buddha and walks away: a teaching cannot carry the awakening that produced it. In the city he apprentices himself to the courtesan-teacher Kamala in the arts of love and to the merchant Kamaswami in the arts of money, loses a decade, and abandons everything at the river of an old ferryman who has nothing to teach but how to listen.", "includes": ["New English translation from the 1922 German: the repetition kept, the body kept, the imported Christian vocabulary gone", "Foreword, introduction and note on translation", "Chapter-by-chapter annotations", "Three original essays", "Glossary of Sanskrit and Pali terms, and a full Translation Appendix"], "essays": [["The Book That Was Not Written in India", "Hesse finished it in a Swiss stone house, having never once reached the country it is set in.", "introduction"], ["The First Spiritual But Not Religious Text", "A century before Pew started counting the category, a novel said the thing the category now says reflexively.", ""], ["The Eros of Siddhartha", "The erotic thread runs the whole length of the novel, and the English has been muffling it for seventy years.", ""], ["How America Was Ready for Siddhartha", "A hundred years of track was already laid when the 1951 paperback arrived, and the industry that followed kept the grammar and dropped the claim.", ""]], "kindle": "B0GX33W7HS"}, {"id": "ot2", "line": "overtime", "no": 2, "img": "o2", "ndigo": "i02", "title": "The Adventures of Pinocchio", "spine": "PINOCCHIO", "author": "Carlo Collodi", "original": "1883 · Italian", "work": "Le avventure di Pinocchio", "edition": "New translation from the 1883 Italian, complete", "editor": "Translated & annotated by Ryan Collison", "summary": "Once upon a time there was a piece of wood. Not a boy: a piece of wood that talked before it had a mouth, kicked before it had feet, and was judged a bad son before Geppetto finished carving him. All thirty-six chapters, from the workshop to the belly of the Dogfish, with the scenes the adaptations drop restored to their places.", "includes": ["The full text in a new English translation, complete and unabridged, all thirty-six chapters", "A note on the translation that shows its work, from burattino to babbo", "An introduction placing Collodi in the new Italy he wrote against", "Three essays that read the book beneath the bedtime story"], "essays": [["The Puppet Collodi Hanged", "The serial ended with a boy dead in a tree. Everything you remember about this book was added afterward, under pressure.", "introduction"], ["Made vs. Born", "The whole book is a personhood application, and 2026 walked straight back into the question it filed.", ""], ["The Nose Is the Tell", "Masking, the close read. Pinocchio is a document of a performance nobody had a word for yet, and the nose is not a lie detector.", ""], ["Geppetto's Wrong Son", "A century of adaptation did to the book exactly what the woodcarver did to the wood.", ""]], "kindle": ""}, {"id": "ot3", "line": "overtime", "no": 3, "img": "o3", "ndigo": "i04", "title": "The Merry Adventures of Robin Hood", "spine": "ROBIN HOOD", "author": "Howard Pyle", "original": "1883 · English", "work": "The Merry Adventures of Robin Hood", "edition": "The essential fifteen tales in the 1883 text", "editor": "Edited by Ryan Collison", "summary": "A young man with a longbow crosses fifteen foresters on the road to Nottingham, and by nightfall he is an outlaw with a price on his head. Little John and the quarterstaff at the bridge, the golden arrow shot under the Sheriff's nose, Friar Tuck carried across the water, and the gathering of the merriest and most dangerous crew in English folklore.", "includes": ["Fifteen complete tales in the 1883 text, chosen whole so the legend reads straight through", "An introduction on the outlaw from the medieval ballads to Pyle's page, and the forest law that made him", "Four essays that pull the legend into the present"], "essays": [["The Come-Up", "The fence makes the felon: how a man comes up outside the law.", ""], ["The Crew", "You fight your way in: how a crew becomes a society.", ""], ["The Ballad Is the Bars", "A hero made of tellings: how every era rhymes the outlaw anew.", ""], ["Broken Windows", "Enclosure by other means: what order costs the people it lands on.", ""]], "kindle": ""}, {"id": "ot4", "line": "overtime", "no": 4, "img": "o4", "ndigo": "i03", "title": "Peter and Wendy", "spine": "PETER & WENDY", "author": "J. M. Barrie", "original": "1911 · English", "work": "Peter and Wendy", "edition": "The complete 1911 novel, text untouched", "editor": "Edited by Ryan Collison", "summary": "All children, except one, grow up. The Darlings of Number 14 lose theirs out the nursery window on a Friday night: Wendy, John and Michael, away to an island where lost boys live under the ground, a crocodile ticks, and a boy with all his first teeth runs the whole cruel, gorgeous machine.", "includes": ["Peter and Wendy, complete and unabridged, the 1911 first-edition text", "An introduction: where it came from, the brother who stayed a boy, and the Pan revival Barrie wrote inside of", "Three essays that bring the novel into the present"], "essays": [["The Grief Under the Pantomime", "Peter Pan was assembled over a decade out of a dead brother, a borrowed god, and somebody else's children.", "introduction"], ["Why Barrie Named Him Pan", "The prefix is the whole argument, and the book built it into the name on the cover.", ""], ["The Faun", "A close read of the god under the boy, and del Toro's Faun standing at the same const P="#E100FF";
const GL={n:[".....",".....","#.##.","##..#","#...#","#...#","#...#",".....","....."],d:["....#","....#",".####","#...#","#...#","#...#",".####",".....","....."],i:["..#..",".....",".##..","..#..","..#..","..#..",".###.",".....","....."],g:[".....",".....",".####","#...#","#...#","#...#",".####","....#",".###."],o:[".....",".....",".###.","#...#","#...#","#...#",".###.",".....","....."]};
(function(){let x=0,c="";for(const ch of "ndigo"){GL[ch].forEach((r,y)=>[...r].forEach((v,cx)=>{if(v==="#")c+=`<circle cx="${(x+cx)*4+2}" cy="${y*4+2}" r="1.7" fill="${P}"/>`}));x+=6;}
 document.getElementById("mark").innerHTML=`<svg viewBox="0 0 ${(x-1)*4} 36" aria-label="ndigo"><defs><filter id="gl"><feGaussianBlur stdDeviation=".9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#gl)">${c}</g></svg>`;})();
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};

const SP=[[74,"s1"],[70,"s2"],[66,"s3"],[75,"s4"]], CV=[[339,518,"c1"],[355,546,"c2"],[335,557,"c3"],[330,533,"c4"]];
const COPIES=8, total=BOOKS.length*COPIES, BANDW=1478;
let pos=Math.floor(COPIES/2)*BOOKS.length, cur=0, timers=[], typer=null;
const plate=document.getElementById("plate"), shot=document.getElementById("shot"), row=document.getElementById("row");
row.innerHTML=Array.from({length:total},(_,p)=>{const b=p%BOOKS.length,[sw,si]=SP[b],[cw,ch,ci]=CV[b];
  return `<button type="button" class="bk" data-p="${p}" style="--sw:${sw}px;--cw:${cw}px;--ch:${ch}px;--k:${p%12}" aria-label="${esc(BOOKS[b].title)}"><span class="bob"><span class="shade"></span><span class="box">
    <span class="face front"><img src="${IMG[ci]}" alt=""></span><span class="face spine"><img src="${IMG[si]}" alt=""></span></span></span></button>`}).join("");
row.querySelectorAll(".bk").forEach(el=>el.onclick=()=>go(+el.dataset.p));
function fit(){const S=shot.clientWidth/1536; plate.style.transform=`scale(${S})`; center(true);}
function center(instant){
  let x=0; for(let p=0;p<pos;p++) x+=SP[p%BOOKS.length][0];
  const tx=BANDW/2-(x+(CV[pos%BOOKS.length][0]+34)/2);
  if(instant){row.style.transition="none";row.style.transform=`translateX(${tx}px)`;void row.offsetWidth;row.style.transition="";}
  else{row.style.transform=`translateX(${tx}px)`;row.classList.remove("moving");void row.offsetWidth;row.classList.add("moving");}
}
function go(p,instant){
  p=Math.max(0,Math.min(total-1,p)); timers.forEach(clearTimeout); timers=[];
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches, quick=instant||reduce;
  row.querySelectorAll(".bk.sel").forEach(el=>el.classList.remove("sel"));
  pos=p; cur=p%BOOKS.length; center(quick);
  timers.push(setTimeout(()=>row.querySelector(`.bk[data-p="${p}"]`)?.classList.add("sel"), quick?0:520));
  readout(BOOKS[cur],quick,quick?0:950);
}
/* the arrows step one book; a slot key would pick the nearest copy */
function readout(b,quick,delay){
  document.getElementById("lcd").textContent=`A${b.no} · ${b.author.toLowerCase()} · ${b.original.split(" · ")[0]}`;
  document.getElementById("lcdR").textContent=`${String(b.no).padStart(2,"0")}/${String(BOOKS.length).padStart(2,"0")}`;
  document.getElementById("kick").textContent=`overtime edition · N°${String(b.no).padStart(2,"0")}`;
  const t=document.getElementById("title"); clearInterval(typer); const full=b.title; let n=0;
  const draw=()=>t.innerHTML=esc(full.slice(0,n))+'<span class="cur"></span>';
  t.innerHTML='<span class="cur"></span>';
  const rows=[["original author",b.author],["original work",b.work],["first published",b.original],["this edition",b.edition],["editor",b.editor],["format","epub · free to read"],["summary",b.summary,"sum"]];
  const kv=document.getElementById("kv"); kv.innerHTML=rows.map(([k,v,c])=>`<dt class="line">${esc(k)}</dt><dd class="line ${c||""}">${esc(v)}</dd>`).join("");
  const side=document.getElementById("side");
  side.innerHTML=`<h3>in this edition <small>${b.includes.length}</small></h3><ul class="inc">${b.includes.map(x=>`<li class="line">${esc(x)}</li>`).join("")}</ul><h3>essays <small>preview</small></h3><ul class="ess">${b.essays.map(([h,s,tag])=>`<li class="line"><button type="button" aria-expanded="false"><span>${esc(h)}</span><span>${tag?esc(tag):"+"}</span></button><div class="pv">${esc(s)}</div></li>`).join("")}</ul>`;
  side.querySelectorAll(".ess li").forEach(li=>li.querySelector("button").onclick=()=>{const o=li.classList.toggle("open");li.querySelector("button").setAttribute("aria-expanded",String(o));});
  const k=document.getElementById("kindle"); k.hidden=!b.kindle; k.href=b.kindle?`https://www.amazon.com/dp/${b.kindle}`:"#";
  const lines=[...document.querySelectorAll(".record .line")];
  if(quick){n=full.length;draw();lines.forEach(l=>l.classList.add("on"));return;}
  timers.push(setTimeout(()=>{typer=setInterval(()=>{n=Math.min(full.length,n+1);draw();if(n>=full.length){clearInterval(typer);lines.forEach((l,i)=>timers.push(setTimeout(()=>l.classList.add("on"),i*55)));}},40);},delay));
}
document.getElementById("free").onclick=e=>e.preventDefault();
document.getElementById("prev").onclick=()=>go(pos-1);
document.getElementById("next").onclick=()=>go(pos+1);
document.addEventListener("keydown",e=>{if(e.target.closest("textarea"))return; if(e.key==="ArrowRight")go(pos+1); if(e.key==="ArrowLeft")go(pos-1);});
addEventListener("resize",fit);
fit(); go(pos,true);

let vote=null,note="",db=null; const btns=[...document.querySelectorAll(".review .seg button")], ta=document.getElementById("note-books");
const paint=()=>{btns.forEach(b=>b.setAttribute("aria-pressed",String(vote===b.dataset.v))); if(document.activeElement!==ta) ta.value=note;};
btns.forEach(b=>b.onclick=()=>{vote=vote===b.dataset.v?null:b.dataset.v; paint(); save();});
ta.onchange=()=>{note=ta.value; save();};
const st=t=>document.getElementById("status").textContent=t;
async function save(){const d={r:vote,note,at:Date.now()}; if(!db){try{localStorage.setItem("ndigo-books5",JSON.stringify(d))}catch(e){} return;} try{await db.doc("review/books5").set(d); st("Saved")}catch(e){st("Didn’t save: "+(e?.message||e?.code||"error"))}}
(async()=>{db=await (window.claude?.use?.("db") ?? null); if(!db){st("Saving in this browser only.");return;} st("Connected."); db.doc("review/books5").onSnapshot(s=>{const v=s.data(); if(v){vote=v.r||null; note=v.note||""; paint();}},()=>st("Lost the connection. Reload."));})();
</script>
</body></html>
