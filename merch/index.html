<style>
/* Layout: one Lite-Brite peg board in a chasing bulb frame. Every word on it is lit pegs sitting on the board's own holes;
   the merch hangs from pegs with number-only ticket stubs. Click an item for sizes and add-to-cart; the cart totals the
   tickets and shows the USD. Website combo; VT323 for UI. */
:root{
  --P:#E100FF; --G:#7CFF4F; --B:#16141A; --ink:#E9E4EE; --dim:#9C95A6; --rule:#2C2833;
  --chrome:#141414; --line:#2E2E2E; --cink:#EDEDED; --cdim:#A3A3A3; --cfaint:#6B6B6B; --cpanel:#1C1C1C;
  --vt:"VT323",ui-monospace,Menlo,monospace; --mono:"Martian Mono",ui-monospace,Menlo,monospace; --carny:"Rubik Mono One","Arial Black",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--B);color:var(--ink);font:400 22px/1.35 var(--vt);overflow-x:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1240px;margin:0 auto}
.review{background:var(--chrome);color:var(--cink);font:400 12px/1.45 var(--mono);border-bottom:1px solid var(--line)}
.review .in{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px}
.review .what{flex:1 1 420px;color:var(--cdim)} .review .what b{color:var(--cink)}
.seg{display:flex}
.seg button{font:400 11px/1 var(--mono);color:var(--cdim);background:none;border:1px solid var(--line);padding:8px 10px;cursor:pointer;margin-left:-1px}
.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button[aria-pressed="true"][data-v="Pick"]{background:var(--P);color:#1a0020;border-color:var(--P)}
.seg button[aria-pressed="true"][data-v="Revise"]{background:var(--G);color:#0c2000;border-color:var(--G)}
.seg button[aria-pressed="true"][data-v="Drop"]{background:#5a5a5a;color:#fff}
.review textarea{flex:1 1 260px;font:400 13px/1.4 var(--mono);color:var(--cink);background:var(--cpanel);border:1px solid var(--line);border-radius:4px;padding:8px;min-height:36px;resize:vertical}
.review .status{color:var(--cfaint)}
header.top{border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--B)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--B)}
header.top .in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:12px}
header.top .brand{display:flex;align-items:center;gap:16px}
header.top svg.mk{height:42px;width:auto;display:block}
.crumb{color:var(--dim);font-size:24px}
.crumb a{color:var(--dim);text-decoration:none}.crumb a:hover{color:var(--G)}
.crumb b{color:var(--ink);font-weight:400}
.cartbtn{display:flex;align-items:center;gap:10px;font:400 24px/1 var(--vt);color:var(--ink);background:#1b1820;border:1px solid #403b47;border-radius:4px;padding:8px 14px;cursor:pointer}
.cartbtn:hover{border-color:var(--G)}
.cartbtn b{font-weight:400;color:var(--B);background:var(--G);border-radius:3px;padding:2px 8px;min-width:28px;text-align:center}
.cartbtn svg{width:26px;height:18px}

/* the store is one generated photograph of the booth; each prize on it is a click target */
main{padding-block:22px 60px}
.board{position:relative;width:100%;max-width:1240px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 30px 60px -30px #000}
.board img.scene{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;padding:0;background:none;cursor:pointer;border-radius:8px}
.hot:hover,.hot:focus-visible{box-shadow:0 0 0 2px #7CFF4Fcc,0 0 28px #7CFF4F55;background:#7CFF4F0d}
.hot span{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);font:400 18px/1 var(--vt);color:#fff;background:#000c;padding:4px 8px;border-radius:3px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.hot:hover span,.hot:focus-visible span{opacity:1}
.legend{max-width:1240px;margin:12px auto 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:20px}
.legend b{color:var(--G);font-weight:400}
.num{display:inline-block;font:400 30px/1 var(--carny);color:var(--B);background:var(--G);padding:8px 14px;border-radius:4px;margin:14px 0}
/* item sheet + cart drawer */
.scrim{position:fixed;inset:0;z-index:40;background:#000b;display:none}
.scrim.on{display:block}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:#141118;border:1px solid #3a3444;border-radius:6px;padding:22px;display:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 30px;align-items:center}
.sheet.on{display:grid}
.sheet img{width:100%;height:auto}
.sheet h3{margin:0;font:400 clamp(34px,4.2vw,54px)/.95 var(--vt)}
.sheet .k{color:var(--P)}
.sheet .stub{position:static;display:inline-block;margin:14px 0;font-size:30px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.sizes button{font:400 22px/1 var(--vt);min-width:52px;padding:10px 12px;border:1px solid #403b47;background:#1b1820;color:var(--ink);cursor:pointer;border-radius:3px}
.sizes button[aria-pressed="true"]{border-color:var(--G);color:var(--G)}
.btn{font:400 26px/1 var(--vt);padding:13px 22px;border:2px solid var(--G);color:var(--B);background:var(--G);border-radius:3px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.x{position:absolute;right:12px;top:10px;font:400 30px/1 var(--vt);background:none;border:0;color:var(--dim);cursor:pointer}
.hint{color:var(--dim);font-size:19px;min-height:1.2em;margin-top:8px}
.drawer{position:fixed;z-index:42;top:0;right:0;bottom:0;width:min(420px,100vw);background:#141118;border-left:1px solid #3a3444;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 18px 18px}
.drawer.on{transform:none}
.drawer h3{margin:0 0 12px;font:400 30px/1 var(--vt);color:var(--P)}
.lines{flex:1;overflow:auto;list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #2c2833}
.lines img{width:64px;height:64px;object-fit:contain}
.lines .nm small{display:block;color:var(--dim);font-size:18px}
.lines .tk{color:var(--G)}
.lines button{background:none;border:0;color:var(--dim);font:400 18px/1 var(--vt);cursor:pointer;padding:0;margin-top:4px}
.empty{color:var(--dim)}
.tot{border-top:1px solid #3a3444;padding-top:14px;margin-top:10px;display:grid;gap:6px}
.tot div{display:flex;justify-content:space-between}
.tot .usd{font-size:30px}
.tot .usd b{color:var(--G);font-weight:400}
.footer{font:400 11px/1.4 var(--mono);color:var(--cfaint);text-align:center;padding:10px 16px 30px;background:var(--chrome)}
:focus-visible{outline:2px solid var(--G);outline-offset:3px}
@media (max-width:720px){.sheet{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>

const P="#E100FF";
const BIG={n:[".....",".....","#.##.","##..#","#...#","#...#","#...#",".....","....."],d:["....#","....#",".####","#...#","#...#","#...#",".####",".....","....."],i:["..#..",".....",".##..","..#..","..#..","..#..",".###.",".....","....."],g:[".....",".....",".####","#...#","#...#","#...#",".####","....#",".###."],o:[".....",".....",".###.","#...#","#...#","#...#",".###.",".....","....."]};
function mkMark(){let x=0,c="";for(const ch of "ndigo"){BIG[ch].forEach((r,y)=>[...r].forEach((v,cx)=>{if(v==="#")c+=`<circle cx="${(x+cx)*4+2}" cy="${y*4+2}" r="1.7" fill="${P}"/>`}));x+=6;} return `<svg class="mk" viewBox="0 0 ${(x-1)*4} 36" aria-label="ndigo">${c}</svg>`;}
document.getElementById("mark").innerHTML=mkMark();
/* click targets over each prize in the photo: [left, top, width, height] in % */
const BOX=[[9.0, 33.5, 22.5, 42.5], [32.0, 33.0, 23.0, 43.0], [55.3, 33.0, 21.0, 43.0], [78.0, 33.5, 15.5, 23.0]];
const board=document.getElementById("board");
ITEMS.forEach((it,i)=>{ const [l,t,w,h]=BOX[i]; const b=document.createElement("button"); b.type="button"; b.className="hot";
  Object.assign(b.style,{left:l+"%",top:t+"%",width:w+"%",height:h+"%"}); b.setAttribute("aria-label",`${it.name}, ${it.tickets} tickets`);
  b.innerHTML=`<span>${it.name} · ${it.tickets} tickets</span>`; b.onclick=()=>openSheet(i); board.appendChild(b); });
/* sheet + cart */
const cart=[]; let cur=0, size=null;
const $=id=>document.getElementById(id), scrim=$("scrim");
function openSheet(i){ cur=i; const it=ITEMS[i]; $("simg").src=it.img; $("simg").alt=it.name; $("sk").textContent=`prize ${String(i+1).padStart(2,"0")} · ${it.kind}`; $("sname").textContent=it.name;
  $("sstub").innerHTML=`<span class="num">${it.tickets} tickets</span>`; $("shint").textContent="";
  size=it.sizes.length===1?it.sizes[0]:null; $("sizes").innerHTML=it.sizes.map(s=>`<button type="button" aria-pressed="${s===size}">${s}</button>`).join("");
  document.querySelectorAll("#sizes button").forEach(b=>b.onclick=()=>{size=b.textContent; document.querySelectorAll("#sizes button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); $("shint").textContent="";});
  scrim.classList.add("on"); $("sheet").classList.add("on"); $("sx").focus(); }
function closeAll(){ scrim.classList.remove("on"); $("sheet").classList.remove("on"); $("drawer").classList.remove("on"); }
$("sx").onclick=closeAll; $("dx").onclick=closeAll; scrim.onclick=closeAll; document.addEventListener("keydown",e=>{if(e.key==="Escape") closeAll();});
$("add").onclick=()=>{ if(!size){ $("shint").textContent="Pick a size first."; return; } cart.push({i:cur,size}); renderCart(); $("shint").textContent=`Added. ${ITEMS[cur].tickets} tickets.`; };
$("cartbtn").onclick=()=>{ renderCart(); scrim.classList.add("on"); $("sheet").classList.remove("on"); $("drawer").classList.add("on"); };
function renderCart(){
  $("cartn").textContent=cart.length;
  const t=cart.reduce((a,c)=>a+ITEMS[c.i].tickets,0);
  $("ttix").textContent=t; $("tusd").textContent=`$${t}`;
  $("lines").innerHTML=cart.length?cart.map((c,k)=>{const it=ITEMS[c.i]; return `<li><img src="${it.img}" alt=""><div class="nm">${it.name}<small>${c.size}</small><button type="button" data-k="${k}">remove</button></div><span class="tk">${it.tickets}</span></li>`}).join(""):`<li class="empty">No tickets spent yet.</li>`;
  document.querySelectorAll(".lines button").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.k,1); renderCart();});
}
renderCart();

let vote=null,note="",db=null; const btns=[...document.querySelectorAll(".review .seg button")], ta=document.getElementById("note-m");
const paint=()=>{btns.forEach(b=>b.setAttribute("aria-pressed",String(vote===b.dataset.v))); if(document.activeElement!==ta) ta.value=note;};
btns.forEach(b=>b.onclick=()=>{vote=vote===b.dataset.v?null:b.dataset.v; paint(); save();});
ta.onchange=()=>{note=ta.value; save();};
const st=t=>document.getElementById("status").textContent=t;
async function save(){const d={r:vote,note,at:Date.now()}; if(!db){try{localStorage.setItem("ndigo-merch2",JSON.stringify(d))}catch(e){} return;} try{await db.doc("review/merch2").set(d); st("Saved")}catch(e){st("Didn’t save: "+(e?.message||e?.code||"error"))}}
(async()=>{db=await (window.claude?.use?.("db") ?? null); if(!db){st("Saving in this browser only.");return;} st("Connected."); db.doc("review/merch2").onSnapshot(s=>{const v=s.data(); if(v){vote=v.r||null; note=v.note||""; paint();}},()=>st("Lost the connection. Reload."));})();
</script>
</body></html>
