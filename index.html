<style>
/* Layout: review bar (grey chrome) over a full website comp. The comp: a Lite-Brite peg board header with the dot-matrix mark, a VT323 menu, terminal-style section lists, the square 1px mark in the footer. Website combo only. */
:root{
  --chrome:#141414; --line:#2E2E2E; --cink:#EDEDED; --cdim:#A3A3A3; --cfaint:#6B6B6B; --cpanel:#1C1C1C;
  --P:#E100FF; --G:#7CFF4F; --B:#16141A; --B2:#1E1B23; --ink:#E9E4EE; --dim:#9C95A6; --rule:#2C2833;
  --vt:"VT323",ui-monospace,Menlo,monospace; --mono:"Martian Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* one board, one room: a single pegboard runs behind the whole page, its holes lined up with the header's pegs (JS sets --pp/--px/--py/--pr), under one shared darkness at the edges */
body{margin:0;color:var(--ink);font:400 22px/1.35 var(--vt);--hole:#060508;--pp:14px;--px:0px;--py:0px;--pr:2.4px;
 background:
  radial-gradient(130% 90% at 50% 38%, transparent 45%, rgba(0,0,0,.6) 100%) fixed,
  radial-gradient(circle, var(--hole) var(--pr), transparent calc(var(--pr) + .8px)) var(--px) var(--py) / var(--pp) var(--pp),
  var(--B)}
html,body{overflow-x:clip}
body.nopegs{background:radial-gradient(130% 90% at 50% 38%, transparent 45%, rgba(0,0,0,.6) 100%) fixed,var(--B)}
/* LED window: the recessed black strip the TV labels sit in, reused for every bit of text on the board */
.led{background:linear-gradient(#040306,#09080c);border-radius:4px;box-shadow:inset 0 2px 9px rgba(0,0,0,.95),inset 0 0 0 1px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.035),0 1px 0 rgba(255,255,255,.06)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* review bar */
.review{background:var(--chrome);color:var(--cink);font:400 12px/1.45 var(--mono);border-bottom:1px solid var(--line)}
.review .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:12px}
.review b{font-weight:600}
.review .what{flex:1 1 380px;color:var(--cdim)}
.review .what b{color:var(--cink)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button,.seg button{font:400 11px/1 var(--mono);color:var(--cdim);background:none;border:1px solid var(--line);padding:8px 10px;border-radius:4px;cursor:pointer}
.toggles button[aria-pressed="true"]{color:var(--chrome);background:var(--cink);border-color:var(--cink)}
.vote{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:4px 0 0 4px;margin-left:0}.seg button:last-child{border-radius:0 4px 4px 0}
.seg button[aria-pressed="true"][data-v="Pick"]{background:var(--P);color:#1a0020;border-color:var(--P)}
.seg button[aria-pressed="true"][data-v="Revise"]{background:var(--G);color:#0c2000;border-color:var(--G)}
.seg button[aria-pressed="true"][data-v="Drop"]{background:#5a5a5a;color:#fff}
.vote textarea{flex:1;min-width:200px;font:400 13px/1.4 var(--mono);color:var(--cink);background:var(--cpanel);border:1px solid var(--line);border-radius:4px;padding:8px;min-height:36px;resize:vertical}
.vote .status{color:var(--cfaint)}

/* the comp */
.board{background:none}
.board .in{max-width:1180px;margin:0 auto;padding-block:clamp(20px,4vw,44px) clamp(14px,3vw,28px)}
.board svg{display:block;width:100%;max-width:940px;height:auto}
.peg{fill:var(--hole,#060508)}
#pegs{display:none}
.lit{opacity:0;transition:opacity .18s ease-out}
.on .lit{opacity:1}
/* idle: a slow dim band trails across the letters, and now and then one peg stutters like a loose bulb */
.idle .lit{animation:trail 9s ease-in-out infinite;animation-delay:var(--d)}
@keyframes trail{0%,72%,100%{opacity:1}82%{opacity:.38}}
.idle .lit.flick{animation:flick .9s steps(1) 1}
@keyframes flick{0%{opacity:1}12%{opacity:.15}24%{opacity:1}40%{opacity:.3}52%{opacity:1}70%{opacity:.6}100%{opacity:1}}
.board .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:20px;margin-top:14px;padding:6px 14px}
.board .meta .g{color:var(--G)}
.cursor{display:inline-block;width:.55em;height:.9em;background:var(--G);vertical-align:-.1em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
nav.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;padding-block:8px}
nav.menu .in{max-width:1180px;margin:0 auto;display:flex;gap:6px 26px;flex-wrap:wrap;padding:8px 14px;font-size:24px}
nav.menu a{color:var(--G);text-decoration:none;text-shadow:0 0 7px rgba(124,255,79,.55)}
nav.menu a::before{content:"> ";color:var(--P);opacity:0}
nav.menu a:hover::before,nav.menu a:focus-visible::before{opacity:1}
nav.menu a:hover{color:var(--P);text-shadow:0 0 7px rgba(225,0,255,.6)}
main.site{max-width:1180px;margin:0 auto;padding-block:clamp(24px,4vw,44px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px}
.blk{border:1px solid var(--rule);background:var(--B2)}
.blk h2{margin:0;font:400 26px/1 var(--vt);padding:12px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:10px}
.blk h2 span:first-child{color:var(--P)}
.blk h2 span:last-child{color:var(--dim);font-size:20px}
.blk ul{list-style:none;margin:0;padding:6px 0}
.blk li{display:flex;justify-content:space-between;gap:12px;padding:6px 14px;border-bottom:1px dashed var(--rule)}
.blk li:last-child{border-bottom:0}
.blk li span:last-child{color:var(--G)}
.blk li.dimrow span{color:var(--dim)!important}
.wide{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 16px}
.blk.wide{border:0;background:none}
.wide p{margin:0;max-width:56ch}
.btn{font:400 24px/1 var(--vt);background:var(--G);color:var(--B);padding:10px 16px;text-decoration:none;white-space:nowrap;border-radius:3px;box-shadow:0 0 18px rgba(124,255,79,.35)}

/* display wall: one generated photo, a link over each lit pane */
.wall{grid-column:1/-1;position:relative;line-height:0;isolation:isolate;margin-block:8px 40px}
/* the photo fades into the board instead of sitting in a box */
.wallimg{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 86%,transparent 100%),linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 86%,transparent 100%),linear-gradient(to right,transparent 0,#000 5%,#000 95%,transparent 100%);mask-composite:intersect}
/* the lit sets keep throwing their colour past the edge of the photo, onto the board and the floor */
.wall::before{content:"";position:absolute;inset:-8% -6% -14%;z-index:-1;pointer-events:none;filter:blur(24px);
 background:radial-gradient(28% 34% at 37% 18%,rgba(255,170,70,.16),transparent 70%),radial-gradient(26% 34% at 88% 18%,rgba(255,130,50,.16),transparent 70%),
  radial-gradient(26% 34% at 12% 70%,rgba(225,0,255,.2),transparent 70%),radial-gradient(26% 34% at 62% 70%,rgba(124,255,79,.12),transparent 70%),
  radial-gradient(60% 18% at 40% 96%,rgba(225,0,255,.18),transparent 70%),radial-gradient(50% 16% at 70% 97%,rgba(124,255,79,.12),transparent 70%)}
.wallimg{display:block;width:100%;height:auto}
.wall .wallimg{position:relative}
.wall a.pane{position:absolute;display:block;border-radius:6px;outline:none;transition:box-shadow .2s ease,background .2s ease}
.wall a.pane:hover,.wall a.pane:focus-visible{background:rgba(124,255,79,.06);box-shadow:0 0 0 2px var(--G),0 0 28px rgba(124,255,79,.35)}
.wall a.pane.m:hover,.wall a.pane.m:focus-visible{background:rgba(225,0,255,.06);box-shadow:0 0 0 2px var(--P),0 0 28px rgba(225,0,255,.35)}
.wall .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.wall a.pane{transition:none}}
footer.site{padding-block:10px 40px}
footer.site .in{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;color:var(--dim);font-size:20px}
footer.site svg{height:34px;width:auto;display:block}
.tag{font:400 11px/1.4 var(--mono);color:var(--cfaint);text-align:center;padding:10px 16px 30px;background:var(--chrome)}
:focus-visible{outline:2px solid var(--G);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.lit{transition:none}.idle .lit,.idle .lit.flick{animation:none}.cursor{animation:none}}
@media (max-width:600px){.wide{grid-template-columns:1fr}}
</style>

<script>
const P="#E100FF", G="#7CFF4F";
const GL = {
 n:[".....",".....","#.##.","##..#","#...#","#...#","#...#",".....","....."],
 d:["....#","....#",".####","#...#","#...#","#...#",".####",".....","....."],
 i:["..#..",".....",".##..","..#..","..#..","..#..",".###.",".....","....."],
 g:[".....",".....",".####","#...#","#...#","#...#",".####","....#",".###."],
 o:[".....",".....",".###.","#...#","#...#","#...#",".###.",".....","....."],
 c:[".....",".....",".####","#....","#....","#....",".####",".....","....."],
 a:[".....",".....",".###.","....#",".####","#...#",".####",".....","....."],
 r:[".....",".....","#.##.","##..#","#....","#....","#....",".....","....."],
 t:["..#..","..#..","#####","..#..","..#..","..#..","...##",".....","....."],
 e:[".....",".....",".###.","#...#","#####","#....",".###.",".....","....."],
 l:[".##..","..#..","..#..","..#..","..#..","..#..",".###.",".....","....."],
};
function cells(str){const out=[];let x=0;for(const ch of str){GL[ch].forEach((r,y)=>[...r].forEach((c,cx)=>{if(c==="#")out.push([x+cx,y])}));x+=6;}return {out,w:x-1};}

/* Board: one peg grid at the cartel pitch; ndigo letters use 2x2 peg blocks... instead: ndigo at pitch 2 (every other peg), cartel at pitch 1 — both sit on the same board. */
function board(){
  const a=cells("ndigo"), b=cells("cartel");
  const pitch=12, r=4.2;
  const colsA=a.w*2, cols=Math.max(colsA, b.w)+8, rows=2+18+2+9+2;
  const ox=4, oyA=2, oyB=oyA+18+2;
  let pegs="", lit="";
  for(let x=0;x<cols;x++)for(let y=0;y<rows;y++)pegs+=`<circle class="peg" cx="${x*pitch+pitch/2}" cy="${y*pitch+pitch/2}" r="${r*.62}"/>`;
  const dot=(x,y,col,big)=>`<circle class="lit" style="transition-delay:${(x*14)}ms;--d:${(x*55)}ms" cx="${x*pitch+pitch/2}" cy="${y*pitch+pitch/2}" r="${big?r*1.9:r}" fill="${col}"/>`;
  /* ndigo: each glyph pixel = one big peg centred in a 2x2 block */
  a.out.forEach(([x,y])=>{const cx=ox+x*2+.5, cy=oyA+y*2+.5; lit+=dot(cx,cy,P,true)});
  b.out.forEach(([x,y])=>{lit+=dot(ox+x,oyB+y,G,false)});
  return `<svg viewBox="0 0 ${cols*pitch} ${rows*pitch}" role="img" aria-label="ndigo cartel">
    <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g id="pegs">${pegs}</g><g id="lights" filter="url(#glow)">${lit}</g></svg>`;
}
function square(){
  const a=cells("ndigo"); const s=4;
  return `<svg viewBox="0 0 ${a.w*s} ${9*s}" shape-rendering="crispEdges" aria-label="ndigo">${a.out.map(([x,y])=>`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="${P}"/>`).join("")}</svg>`;
}
const opts={pegs:true,glow:true,flicker:true};
const mark=document.getElementById("mark");
mark.innerHTML=board();
document.getElementById("sq").innerHTML=square();
const svg=mark.querySelector("svg");
let idleT;
const light=()=>{clearTimeout(idleT); svg.classList.remove("on","idle"); void svg.getBoundingClientRect(); requestAnimationFrame(()=>svg.classList.add("on")); idleT=setTimeout(()=>{if(opts.flicker)svg.classList.add("idle")},1600);};
const pegsLit=[...svg.querySelectorAll(".lit")];
const vbW=svg.viewBox.baseVal.width;
function alignBoard(){const r=svg.getBoundingClientRect(), k=r.width/vbW, b=document.body.style;
  b.setProperty("--pp",(12*k)+"px"); b.setProperty("--pr",(2.6*k)+"px");
  b.setProperty("--px",(r.left+scrollX)+"px"); b.setProperty("--py",(r.top+scrollY)+"px");}
alignBoard(); new ResizeObserver(alignBoard).observe(document.body); document.fonts?.ready.then(alignBoard);
(function stutter(){setTimeout(()=>{if(svg.classList.contains("idle")){const p=pegsLit[Math.floor(Math.random()*pegsLit.length)];p.classList.remove("flick");void p.getBoundingClientRect();p.classList.add("flick");p.addEventListener("animationend",()=>p.classList.remove("flick"),{once:true});}stutter();},1400+Math.random()*2600)})();
light();

document.querySelectorAll(".toggles button").forEach(b=>b.addEventListener("click",()=>{
  const t=b.dataset.t;
  if(t==="replay"){light();return;}
  opts[t]=!opts[t]; b.setAttribute("aria-pressed",String(opts[t]));
  document.body.classList.toggle("nopegs",!opts.pegs);
  svg.querySelector("#lights").setAttribute("filter",opts.glow?"url(#glow)":"");
  svg.classList.toggle("idle",opts.flicker&&svg.classList.contains("on"));
  save();
}));

let vote=null, note="", db=null;
const segBtns=[...document.querySelectorAll(".seg button")];
const ta=document.getElementById("note-home");
function paint(){segBtns.forEach(b=>b.setAttribute("aria-pressed",String(vote===b.dataset.v))); if(document.activeElement!==ta) ta.value=note;}
segBtns.forEach(b=>b.addEventListener("click",()=>{vote=vote===b.dataset.v?null:b.dataset.v; paint(); save();}));
ta.addEventListener("change",()=>{note=ta.value; save();});
function setStatus(t){document.getElementById("status").textContent=t}
async function save(){
  const data={r:vote,note,pegs:opts.pegs,glow:opts.glow,at:Date.now()};
  if(!db){try{localStorage.setItem("ndigo-home",JSON.stringify(data))}catch(e){} return;}
  try{await db.doc("home/layout3").set(data); setStatus("Saved");}catch(e){setStatus("Didn’t save: "+(e?.message||e?.code||"error"))}
}
(async()=>{
  db=await (window.claude?.use?.("db") ?? null);
  if(!db){setStatus("Saving in this browser only.");return;}
  setStatus("Connected.");
  db.doc("home/layout3").onSnapshot(s=>{const v=s.data(); if(v){vote=v.r||null; note=v.note||""; paint();}}, e=>setStatus("Lost the connection. Reload."));
})();
</script>
